<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shariq Hafizi</title>
<script>
  /* GitHub Pages serves this file for any path that isn't a real file, which
     is how /autonomous-future and /equitle reach the document. Remember where
     the visitor was headed, then hand off; main.js reads it back and opens
     that tab, restoring the path in the address bar.

     This file holds no content on purpose, so it never falls out of step with
     index.html. */
  try { sessionStorage.setItem("gdocs-path", location.pathname); } catch (e) {}
  location.replace("/");
</script>
</head>
<body></body>
</html>
